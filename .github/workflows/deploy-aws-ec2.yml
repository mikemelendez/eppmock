name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy on EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_SSH_PORT || '22' }}
          script_stop: true
          script: |
            set -eu

            APP_DIR="${APP_DIR:-/opt/epp-testing-tool}"
            REPO_URL="https://github.com/mikemelendez/eppmock.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$USER":"$USER" "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cat > deploy/.env <<'EOF'
            RESET_HTTP_USER=${{ secrets.RESET_HTTP_USER }}
            RESET_HTTP_PASSWORD=${{ secrets.RESET_HTTP_PASSWORD }}
            EPP_USERS=${{ secrets.EPP_USERS }}
            EOF

            docker compose -f deploy/docker-compose.aws.yml up -d --build
            docker compose -f deploy/docker-compose.aws.yml restart caddy
            sleep 5

            if ! docker compose -f deploy/docker-compose.aws.yml ps app | grep -q "Up"; then
              docker compose -f deploy/docker-compose.aws.yml ps
              docker compose -f deploy/docker-compose.aws.yml logs --tail=100 app
              exit 1
            fi

            if ! docker compose -f deploy/docker-compose.aws.yml exec -T app node -e "fetch('http://127.0.0.1:8080/health').then(async (response) => { if (!response.ok) { console.error(await response.text()); process.exit(1); } }).catch((error) => { console.error(error); process.exit(1); })"; then
              docker compose -f deploy/docker-compose.aws.yml logs --tail=100 app
              exit 1
            fi

            docker image prune -f
