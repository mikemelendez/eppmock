services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - caddy
    env_file:
      - .env
    environment:
      EPP_HOST: 0.0.0.0
      EPP_PORT: "700"
      EPP_DASHBOARD_HOST: 127.0.0.1
      EPP_DASHBOARD_PORT: "7000"
      EPP_MOCK_HOST: 127.0.0.1
      EPP_MOCK_PORT: "7001"
      WHOIS_HOST: 0.0.0.0
      WHOIS_PORT: "43"
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: "8080"
      RDAP_HOST: 0.0.0.0
      RDAP_PORT: "8090"
      REGISTRY_TLD: melendez
      STORAGE_MODE: sqlite
      SQLITE_PATH: /app/data/epp-testing-tool.sqlite
      DNSSEC_KEY_PATH: /app/data/dnssec-keys.json
      GREETING_SERVER_ID: epp-testing-tool
      EPP_HOSTNAME: ${EPP_HOSTNAME:-eppmock.melendez.mx}
      EPP_TLS_CERT: /app/certs/fullchain.pem
      EPP_TLS_KEY: /app/certs/privkey.pem
      EPP_TLS_REQUIRE_CLIENT_CERT: "true"
      CADDY_CERTS_ROOT: /caddy-data/caddy/certificates
      EPP_CERT_DIR: /app/certs
    volumes:
      - epp_data:/app/data
      - caddy_data:/caddy-data:ro
    ports:
      - "43:43"
      - "700:700"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 130s

volumes:
  epp_data:
  caddy_data:
  caddy_config:
