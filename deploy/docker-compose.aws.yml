services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EPP_HOST: 0.0.0.0
      EPP_PORT: 7000
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 8080
      STORAGE_MODE: sqlite
      SQLITE_PATH: /app/data/epp-testing-tool.sqlite
      DNSSEC_KEY_PATH: /app/data/dnssec-keys.json
      GREETING_SERVER_ID: epp-testing-tool
    volumes:
      - epp_data:/app/data
    ports:
      - "7000:7000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  epp_data:
  caddy_data:
  caddy_config:
